changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - question
      - wontfix
      - ignore-for-release
      - "autorelease: pending"
      - "autorelease: tagged"
    authors:
      - dependabot
      - github-actions
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: New Features
      labels:
        - feature
    - title: Bug Fixes
      labels:
        - fix
    - title: Accessibility
      labels:
        - accessibility
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
